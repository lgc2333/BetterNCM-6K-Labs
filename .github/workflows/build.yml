name: Build and publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-n-publish:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout workspace
        uses: actions/checkout@master
        with:
          repository: lgc2333/BetterNCM-Workspace
          submodules: true

      - name: Get package folder name
        id: folder_name
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          $folderName = $env:REPO_NAME -replace '^BetterNCM-', ''
          "folder_name=$folderName"
          "folder_name=$folderName" >> $env:GITHUB_OUTPUT

      - name: Checkout current package submodule at specific commit
        run: |-
          Set-Location "packages/${{ steps.folder_name.outputs.folder_name }}"
          git checkout ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/${{ steps.folder_name.outputs.folder_name }}
        run: |-
          pnpm run build

      - name: Deploy
        uses: lgc2333/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: dist
          FOLDER: packages/${{ steps.folder_name.outputs.folder_name }}/dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: 'upload dist [skip-ci]'
          SQUASH_HISTORY: true
