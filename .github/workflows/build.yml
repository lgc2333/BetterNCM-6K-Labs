name: Build and publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-n-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_os: [windows]
        go-arch: [amd64]

    steps:
      - name: Checkout workspace
        uses: actions/checkout@master
        with:
          repository: lgc2333/BetterNCM-Workspace
          submodules: true

      - name: Get package folder name
        id: folder_name
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          folder_name="${REPO_NAME#BetterNCM-}"
          echo "folder_name=${folder_name}"
          echo "folder_name=${folder_name}" >> "$GITHUB_OUTPUT"

      - name: Checkout current package submodule at specific commit
        run: |-
          cd packages/${{ steps.folder_name.outputs.folder_name }}
          git checkout ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Go dependencies
        working-directory: packages/${{ steps.folder_name.outputs.folder_name }}/backend-server
        run: go get .

      - name: Build
        working-directory: packages/${{ steps.folder_name.outputs.folder_name }}
        env:
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go-arch }}
        run: |-
          pnpm run build

      - name: Deploy
        uses: lgc2333/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: dist
          FOLDER: packages/${{ steps.folder_name.outputs.folder_name }}/dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: 'upload dist [skip-ci]'
          SQUASH_HISTORY: true
